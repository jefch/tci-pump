<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCI pump</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d1117;
      --panel-bg: #161b22;
      --pixel-border: #30363d;
    }

    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      background-color: #0b0e14;
      background-image: 
        linear-gradient(rgba(18, 24, 38, 0.9) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 24, 38, 0.9) 1px, transparent 1px);
      background-size: 16px 16px;
      color: #e6edf3;
      font-family: 'Noto Sans TC', monospace, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-pixel-en {
      font-family: 'Press Start 2P', 'Noto Sans TC', monospace;
    }

    .font-vt {
      font-family: 'VT323', 'Noto Sans TC', monospace;
    }

    /* 8-bit Box Borders */
    .pixel-box {
      background: #161c28;
      border: 4px solid #3b465e;
      box-shadow: 
        inset -4px -4px 0px 0px #0d111a,
        inset 4px 4px 0px 0px #252f42,
        5px 5px 0px 0px #05070a;
    }

    .pixel-btn {
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px 0px rgba(0,0,0,0.45),
        inset 3px 3px 0px 0px rgba(255,255,255,0.25),
        3px 3px 0px 0px #000;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      cursor: pointer;
      user-select: none;
    }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 
        inset 2px 2px 0px 0px rgba(0,0,0,0.5),
        1px 1px 0px 0px #000;
    }

    /* High-Visibility 8-Bit Rate Readout Box */
    .rate-display-box {
      position: relative;
      background: linear-gradient(135deg, #2b1605 0%, #170d04 55%, #231104 100%);
      border: 4px solid #f59e0b;
      box-shadow:
        inset 0 0 0 2px #78350f,
        inset 0 0 20px rgba(245, 158, 11, 0.25),
        0 4px 0 #000;
    }

    .rate-number-glow {
      color: #fef08a;
      text-shadow:
        0 0 10px rgba(250, 204, 21, 0.75),
        3px 3px 0px #78350f;
    }

    /* Active Checkpoint Highlight Pulse */
    @keyframes checkpointPulse {
      0%, 100% {
        box-shadow: 0 0 0 2px #000, 0 0 12px rgba(57, 255, 20, 0.85);
        transform: translateY(-1px);
      }
      50% {
        box-shadow: 0 0 0 2px #000, 0 0 4px rgba(57, 255, 20, 0.3);
        transform: translateY(0px);
      }
    }

    .active-checkpoint-block {
      background: #39ff14 !important;
      color: #000 !important;
      border: 2px solid #fff !important;
      animation: checkpointPulse 1.4s infinite;
    }

    /* Custom Range Slider 8-bit */
    input[type=range].pixel-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      background: #0d131a;
      border: 3px solid #3b465e;
      outline: none;
    }

    input[type=range].pixel-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 24px;
      background: #f59e0b;
      border: 3px solid #000;
      box-shadow: inset -2px -2px 0 #92400e, inset 2px 2px 0 #fde68a;
      cursor: pointer;
    }

    input[type=range].pixel-slider::-moz-range-thumb {
      width: 22px;
      height: 24px;
      background: #f59e0b;
      border: 3px solid #000;
      box-shadow: inset -2px -2px 0 #92400e, inset 2px 2px 0 #fde68a;
      cursor: pointer;
      border-radius: 0;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      opacity: 1;
    }
  </style>
</head>

  <script>
    // =========================================================================
    // 8-BIT AUDIO SYNTHESIZER
    // =========================================================================
    let soundEnabled = false;
    let audioCtx = null;

    function playBeep(freq = 520, duration = 0.05, type = 'square') {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Ignore audio errors
      }
    }

    // =========================================================================

    // =========================================================================

    // =========================================================================
    // STATE MANAGEMENT
    // =========================================================================
    const state = {
      patient: {
        sex: 'M',
        age: 50,
        height: 168,
        weight: 65
      },
      pendingCounts: {
        propofol: 0,
        remifentanil: 0,

    let globalTimerId = null;

    // =========================================================================
    // TIMER & CHECKPOINT HELPERS
    // =========================================================================
    function formatHms(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = n => String(n).padStart(2, '0');
      return `${pad(h)}時 ${pad(m)}分 ${pad(s)}秒`;
    }

    function getPumpTotalElapsedSec(pump) {
      if (!pump.started) return 0;
      const priorSec = (pump.history || []).reduce((acc, seg) => acc + seg.durationSec, 0);
      const currentStageSec = getPumpStageElapsedSec(pump);
      return priorSec + currentStageSec;
    }

    function getPumpStageElapsedSec(pump) {
      if (!pump.started) return 0;
      const liveDeltaSec = pump.stageStartMs ? Math.floor((Date.now() - pump.stageStartMs) / 1000) : 0;
      return Math.max(0, (pump.stageOffsetSec || 0) + liveDeltaSec);
    }

    /**
     * Given elapsed minutes in current stage, determine which checkpoint block (15, 30, 45, 60, 90, 120, 180)
     * should be highlighted.
     * - 0 <= min < 30 -> 15m
     * - 30 <= min < 45 -> 30m ("例如30分鐘到了，30分鐘的建議流速的色塊會變化提醒")
     * - 45 <= min < 60 -> 45m
     * - 60 <= min < 90 -> 60m
     * - 90 <= min < 120 -> 90m
     * - 120 <= min < 180 -> 120m (2hr)
     * - min >= 180 -> 180m (3hr)
     */
    function getAutoCheckpointForMinutes(stageMin) {
      if (stageMin >= 180) return 180;
      if (stageMin >= 120) return 120;
      if (stageMin >= 90) return 90;
      if (stageMin >= 60) return 60;
      if (stageMin >= 45) return 45;
      if (stageMin >= 30) return 30;
      return 15;
    }

    // =========================================================================
    // ANTHROPOMETRIC & 3-COMPARTMENT iTIVA ENGINE
    // =========================================================================
    function getAnthropometrics(p) {
      let lbmRaw;
      if (p.sex === 'M') {
        const peakWeight = (1.10 * p.height * p.height) / 256;
        const effectiveW = Math.min(p.weight, peakWeight);
        lbmRaw = 1.10 * effectiveW - 128 * Math.pow(effectiveW / p.height, 2);
      } else {
        const peakWeight = (1.07 * p.height * p.height) / 296;
        const effectiveW = Math.min(p.weight, peakWeight);
        lbmRaw = 1.07 * effectiveW - 148 * Math.pow(effectiveW / p.height, 2);
      }
      const lbm = Math.max(25, lbmRaw);
      return { lbm };
    }

    function getPkModelParams(drugId, p, anthro) {
      const { age, weight, height, sex } = p;
      const { lbm } = anthro;

      if (drugId === 'propofol') {
        const V1 = 4.27;
        const V2 = Math.max(4.0, 18.9 - 0.391 * (age - 53));
        const V3 = 238.0;
        const k10 = Math.max(0.10, 0.443 + 0.0107 * (weight - 77) - 0.0159 * (lbm - 59) + 0.0062 * (height - 177));
        const k12 = Math.max(0.05, 0.302 - 0.0056 * (age - 53));
        const k13 = 0.196;
        const k21 = Math.max(0.01, (1.29 - 0.024 * (age - 53)) / V2);
        const k31 = 0.0035;
        const ke0 = 0.456;
        return { V1, V2, V3, k10, k12, k21, k13, k31, ke0, tPeak: 1.69 };
      }

      if (drugId === 'remifentanil') {
        const V1 = Math.max(2.0, 5.1 - 0.0201 * (age - 40) + 0.072 * (lbm - 55));
        const V2 = Math.max(3.0, 9.82 - 0.0811 * (age - 40) + 0.108 * (lbm - 55));
        const V3 = 5.42;
        const Cl1 = Math.max(0.8, 2.6 - 0.0162 * (age - 40) + 0.0191 * (lbm - 55));
        const Cl2 = Math.max(0.4, 2.05 - 0.0301 * (age - 40));
        const Cl3 = Math.max(0.015, 0.076 - 0.00113 * (age - 40));
        const k10 = Cl1 / V1;
        const k12 = Cl2 / V1;
        const k21 = Cl2 / V2;
        const k13 = Cl3 / V1;
        const k31 = Cl3 / V3;
        const ke0 = Math.max(0.15, 0.595 - 0.007 * (age - 40));
        return { V1, V2, V3, k10, k12, k21, k13, k31, ke0, tPeak: 1.5 };
      }

      if (drugId === 'alfentanil') {
        const V1 = sex === 'F' ? 0.111 * 1.15 * weight : 0.111 * weight;
        const k12 = 0.104;
        const k13 = 0.017;
        const k21 = 0.0673;
        const k31 = age > 40 ? Math.max(0.004, 0.0126 - 0.000113 * (age - 40)) : 0.0126;
        const baseCl1 = age > 40 ? Math.max(0.10, 0.356 - 0.00269 * (age - 40)) : 0.356;
        const Cl1 = baseCl1 * (sex === 'F' ? 1.15 : 1.0) * (weight / 70);
        const k10 = Cl1 / V1;
        const V2 = V1 * (k12 / k21);
        const V3 = V1 * (k13 / k31);
        const ke0 = 0.77;
        return { V1, V2, V3, k10, k12, k21, k13, k31, ke0, tPeak: 1.4 };
      }

      if (drugId === 'precedex') {
        const scaleW = weight / 70.0;
        const scaleCl = Math.pow(scaleW, 0.75);
        const V1 = 1.78 * scaleW;
        const V2 = 30.3 * scaleW;
        const V3 = 52.0 * scaleW;
        const Cl1 = 0.686 * scaleCl;
        const Cl2 = 2.98 * scaleCl;
        const Cl3 = 0.602 * scaleCl;
        const k10 = Cl1 / V1;
        const k12 = Cl2 / V1;
        const k21 = Cl2 / V2;
        const k13 = Cl3 / V1;
        const k31 = Cl3 / V3;
        const ke0 = 0.077;
        return { V1, V2, V3, k10, k12, k21, k13, k31, ke0, tPeak: 8.0 };
      }

      return null;
    }

    function simulateDecrementPause(pk, oldCe, newCe, startC2, startC3) {
      let c1 = oldCe;
      let c2 = startC2;
      let c3 = startC3;
      let ce = oldCe;
      const dt = 0.05;
      let t = 0;
      const maxMin = 240;

      while (ce > newCe && t < maxMin) {
        const dc1 = (-pk.k10 * c1 + pk.k12 * (c2 - c1) + pk.k13 * (c3 - c1)) * dt;
        const dc2 = (pk.k21 * (c1 - c2)) * dt;
        const dc3 = (pk.k31 * (c1 - c3)) * dt;
        const dce = (pk.ke0 * (c1 - ce)) * dt;
        c1 = Math.max(0, c1 + dc1);
        c2 = Math.max(0, c2 + dc2);
        c3 = Math.max(0, c3 + dc3);
        ce = Math.max(0, ce + dce);
        t += dt;
      }

      return {
        pauseMin: t,
        c2AfterPause: c2,
        c3AfterPause: c3
      };
    }

    function advanceTissueState(pk, targetCe, durationMin, startC2, startC3) {
      const c2 = targetCe + (startC2 - targetCe) * Math.exp(-pk.k21 * durationMin);
      const c3 = targetCe + (startC3 - targetCe) * Math.exp(-pk.k31 * durationMin);
      return { c2, c3 };
    }

    function computeRateMlHrAt(pk, conc, targetCe, deltaMin, baseC2, baseC3) {
      const { c2, c3 } = advanceTissueState(pk, targetCe, deltaMin, baseC2, baseC3);
      const rateMassPerMin = pk.V1 * (
        pk.k10 * targetCe +
        pk.k12 * (targetCe - c2) +
        pk.k13 * (targetCe - c3)
      );
      return Math.max(0, (rateMassPerMin * 60) / conc);
    }

    function calculatePumpOutput(pump, patient, anthro) {
      const spec = DRUG_CATALOG[pump.drugId];
      const conc = Math.max(0.01, parseFloat(pump.conc) || spec.defaultConc);
      const confirmedTarget = Math.max(0.01, parseFloat(pump.confirmedTarget) || spec.defaultTarget);

      if (spec.mode === 'tci_ce') {
        const pk = getPkModelParams(pump.drugId, patient, anthro);

        // Replay confirmed history segments
        let baseC2 = 0;
        let baseC3 = 0;
        let priorTotalSec = 0;
        let prevCe = 0;

        if (pump.history && pump.history.length > 0) {
          pump.history.forEach(seg => {
            const segMin = seg.durationSec / 60;
            const nextState = advanceTissueState(pk, seg.ce, segMin, baseC2, baseC3);
            baseC2 = nextState.c2;
            baseC3 = nextState.c3;
            priorTotalSec += seg.durationSec;
            prevCe = seg.ce;
          });
        }

        const priorTotalMin = priorTotalSec / 60;
        let transitionInfo = null;
        let effectiveStartC2 = baseC2;
        let effectiveStartC3 = baseC3;

        if (pump.started) {
          if (priorTotalSec === 0) {
            const initBolusMass = confirmedTarget * pk.V1 * (1 + 0.65 * pk.k12 * pk.tPeak + 0.5 * pk.k10 * pk.tPeak);
            const initBolusMl = initBolusMass / conc;
            transitionInfo = {
              type: 'initial',
              bolusMl: initBolusMl,
              bolusMass: initBolusMass
            };
          } else if (Math.abs(confirmedTarget - prevCe) >= 0.01) {
            if (confirmedTarget > prevCe) {
              const deltaCe = confirmedTarget - prevCe;
              const stepBolusMass = deltaCe * pk.V1 * (1 + 0.55 * pk.k12 * pk.tPeak + 0.4 * pk.k10 * pk.tPeak);
              const stepBolusMl = stepBolusMass / conc;
              const baseMaintMlHr = computeRateMlHrAt(pk, conc, confirmedTarget, 2, baseC2, baseC3);
              const boost2MinMlHr = baseMaintMlHr + (stepBolusMl * 30);
              transitionInfo = {
                type: 'step_up',
                prevCe,
                priorTotalMin: Math.round(priorTotalMin),
                bolusMl: stepBolusMl,
                bolusMass: stepBolusMass,
                boost2MinMlHr
              };
            } else {
              const pauseSim = simulateDecrementPause(pk, prevCe, confirmedTarget, baseC2, baseC3);
              effectiveStartC2 = pauseSim.c2AfterPause;
              effectiveStartC3 = pauseSim.c3AfterPause;
              transitionInfo = {
                type: 'step_down',
                prevCe,
                priorTotalMin: Math.round(priorTotalMin),
                pauseMin: pauseSim.pauseMin
              };
            }
          }
        }

        const stageElapsedSec = getPumpStageElapsedSec(pump);
        const stageElapsedMin = stageElapsedSec / 60;
        const activeCheckpointMin = getAutoCheckpointForMinutes(stageElapsedMin);
        pump.lastAutoCheckpoint = activeCheckpointMin;

        const activeMlHr = computeRateMlHrAt(pk, conc, confirmedTarget, activeCheckpointMin, effectiveStartC2, effectiveStartC3);

        const schedule = TIME_CHECKPOINTS.map(tMin => ({
          tMin,
          label: tMin >= 120 ? `${tMin / 60}hr` : `${tMin}m`,
          mlHr: computeRateMlHrAt(pk, conc, confirmedTarget, tMin, effectiveStartC2, effectiveStartC3)
        }));

        return {
          mode: 'tci_ce',
          activeMlHr,
          activeCheckpointMin,
          stageElapsedSec,
          totalElapsedSec: priorTotalSec + stageElapsedSec,
          schedule,
          transitionInfo
        };
      } else {
        let activeMassHr = 0;
        if (pump.drugId === 'rocuronium') {
          activeMassHr = confirmedTarget * patient.weight;
        } else if (pump.drugId === 'cisatracurium') {
          activeMassHr = (confirmedTarget * patient.weight * 60) / 1000;
        }
        const activeMlHr = activeMassHr / conc;
        return {
          mode: 'nmbd_maint',
          activeMlHr,
          totalElapsedSec: getPumpTotalElapsedSec(pump)
        };
      }
    }

    /**
     * Confirm button handler for a single pump:
     * - Starts timer on first confirmation
     * - Or commits previous stage duration & Ce into history and calculates transition plan for new Ce
     */
    function confirmPumpTarget(pump) {
      if (!pump.started) {
        pump.started = true;
        pump.confirmedTarget = pump.target;
        pump.stageStartMs = Date.now();
        pump.stageOffsetSec = 0;
        pump.lastAutoCheckpoint = 15;
      } else {
        const elapsedStageSec = getPumpStageElapsedSec(pump);
        if (Math.abs(pump.target - pump.confirmedTarget) >= 0.001) {
          // Record previous Ce and its accumulated time (minimum 60s if confirmed during a run so history is captured)
          const recordedSec = Math.max(60, elapsedStageSec);
          pump.history.push({
            ce: pump.confirmedTarget,
            durationSec: recordedSec
          });
          pump.confirmedTarget = pump.target;
          pump.stageStartMs = Date.now();
          pump.stageOffsetSec = 0;
          pump.lastAutoCheckpoint = 15;
        }
      }
      renderAll();
    }

    // =========================================================================
    // PUMP SYNCHRONIZATION & ACTIONS
    // =========================================================================
    function applyPendingPumpsAndShow() {
      const nextPumps = [];
      Object.keys(DRUG_CATALOG).forEach(drugId => {
        const desiredCount = state.pendingCounts[drugId] || 0;
        const existingOfDrug = state.pumps.filter(p => p.drugId === drugId);
        const spec = DRUG_CATALOG[drugId];

        for (let i = 0; i < desiredCount; i++) {
          if (i < existingOfDrug.length) {
            nextPumps.push(existingOfDrug[i]);
          } else {
            nextPumps.push({
              instanceId: state.nextInstanceId++,
              drugId: spec.id,
              mode: spec.mode,
              conc: spec.defaultConc,
              target: spec.defaultTarget,
              confirmedTarget: spec.defaultTarget,
              started: false,
              stageStartMs: null,
              stageOffsetSec: 0,
              lastAutoCheckpoint: 15,
              history: []
            });
          }
        }
      });

      state.pumps = nextPumps;
      if (state.pumps.length > 0) {
        state.setupCollapsed = true;
      }
      renderAll();
    }

    function clearAllPumps() {
      Object.keys(state.pendingCounts).forEach(k => {
        state.pendingCounts[k] = 0;
      });
      state.pumps = [];
      state.setupCollapsed = false;
      renderAll();
    }

    // =========================================================================
    // REAL-TIME 1-SECOND TICKER (Updates HH:MM:SS & Auto-Jumps Checkpoints)
    // =========================================================================
    function startGlobalTicker() {
      if (globalTimerId) clearInterval(globalTimerId);
      globalTimerId = setInterval(() => {
        let needsFullReRender = false;

        state.pumps.forEach(pump => {
          if (!pump.started) return;
          const totalSec = getPumpTotalElapsedSec(pump);
          const timerEl = document.querySelector(`[data-timer-display="${pump.instanceId}"]`);
          if (timerEl) {
            timerEl.textContent = formatHms(totalSec);
          }

          if (pump.mode === 'tci_ce') {
            const stageMin = getPumpStageElapsedSec(pump) / 60;
            const nextCp = getAutoCheckpointForMinutes(stageMin);
            if (nextCp !== pump.lastAutoCheckpoint) {
              pump.lastAutoCheckpoint = nextCp;
              needsFullReRender = true;
            }
          }
        });

        if (needsFullReRender) {
          playBeep(880, 0.12, 'square');
          const anthro = getAnthropometrics(state.patient);
          renderPumpRack(anthro);
        }
      }, 1000);
    }

    // UI RENDERING FUNCTIONS
    // =========================================================================
    function updateSetupCollapseUI() {
      const setupContainer = document.getElementById('setupContainer');
      const compactBar = document.getElementById('compactSetupBar');
      const collapseTopBtn = document.getElementById('btnCollapseSetupTop');
      const compactText = document.getElementById('compactPatientText');

      const sexLabel = state.patient.sex === 'M' ? '♂ 男' : '♀ 女';
      compactText.textContent = `${sexLabel} | ${state.patient.age} 歲 | ${state.patient.height} cm | ${state.patient.weight} kg`;

      if (state.setupCollapsed && state.pumps.length > 0) {
        setupContainer.classList.add('hidden');
        compactBar.classList.remove('hidden');
      } else {
        setupContainer.classList.remove('hidden');
        compactBar.classList.add('hidden');
        if (state.pumps.length > 0) {
          collapseTopBtn.classList.remove('hidden');
        } else {
          collapseTopBtn.classList.add('hidden');
        }
      }
    }

    function updatePatientMonitorUI() {
      const anthro = getAnthropometrics(state.patient);

      const btnM = document.getElementById('sexMale');
      const btnF = document.getElementById('sexFemale');
      if (state.patient.sex === 'M') {
        btnM.className = 'pixel-btn py-1 text-xs font-bold bg-[#2563eb] text-white';
        btnF.className = 'pixel-btn py-1 text-xs font-bold bg-[#1e293b] text-[#94a3b8]';
      } else {
        btnF.className = 'pixel-btn py-1 text-xs font-bold bg-[#db2777] text-white';
        btnM.className = 'pixel-btn py-1 text-xs font-bold bg-[#1e293b] text-[#94a3b8]';

      return anthro;
    }

    function renderPumpRack(anthro) {
      const grid = document.getElementById('pumpRackGrid');
      const emptyState = document.getElementById('emptyPumpState');
      const countBadge = document.getElementById('activePumpCount');
      const clearActiveBtn = document.getElementById('btnClearActiveRack');

      countBadge.textContent = `${state.pumps.length} 台`;

      if (state.pumps.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        clearActiveBtn.classList.add('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      clearActiveBtn.classList.remove('hidden');
      grid.innerHTML = '';

      state.pumps.forEach((pump, idx) => {
        const spec = DRUG_CATALOG[pump.drugId];
        const calc = calculatePumpOutput(pump, state.patient, anthro);
        const hasUnconfirmedChange = !pump.started || Math.abs(pump.target - pump.confirmedTarget) >= 0.001;

        const card = document.createElement('div');
        card.className = 'pixel-box flex flex-col justify-between overflow-hidden';
        card.style.borderTopWidth = '6px';
        card.style.borderTopColor = spec.isoColor;

        const concPresetsHtml = spec.concPresets.map(cp => {
          const isSelected = Math.abs(pump.conc - cp.val) < 0.001;
          return `
            <button type="button" data-action="set-conc" data-id="${pump.instanceId}" data-val="${cp.val}"
              class="px-1.5 py-0.5 text-[11px] font-bold border ${isSelected ? 'bg-[#fde047] text-black border-black' : 'bg-[#1a2232] text-[#94a3b8] border-[#334155] hover:text-white'}">
              ${cp.label}
            </button>
          `;
        }).join('');

        const targetPresetsHtml = spec.clinicalPresets.map(tp => {
          const isSelected = Math.abs(pump.target - tp.val) < 0.001;
          return `
            <button type="button" data-action="set-target" data-id="${pump.instanceId}" data-val="${tp.val}"
              class="px-2 py-1 text-xs font-bold border ${isSelected ? 'bg-[#38bdf8] text-black border-black' : 'bg-[#141c2b] text-[#cbd5e1] border-[#334155] hover:border-[#38bdf8]'}">
              ${tp.label}
            </button>
          `;
        }).join('');

        // Build Transition & Time-Based Schedule (Visible after first 確認濃度)
        let confirmedDetailsHtml = '';

        if (!pump.started) {
          confirmedDetailsHtml = `
            <div class="bg-[#0d131f] border-2 border-dashed border-[#3b465e] p-3 text-center text-xs text-[#94a3b8]">
              請設定目標 ${spec.mode === 'tci_ce' ? 'Ce' : '維持劑量'} 後點擊上方 <strong class="text-[#39ff14]">「確認濃度」</strong>，即可啟動計時並顯示追加劑量／等待時間與分時段建議流速。
            </div>
          `;
        } else if (calc.mode === 'tci_ce') {
          let transitionBannerHtml = '';
          if (calc.transitionInfo) {
            if (calc.transitionInfo.type === 'initial') {
              transitionBannerHtml = `
                <div class="bg-[#132238] border-2 border-[#38bdf8] px-2.5 py-2 text-xs text-[#bae6fd] flex items-center justify-between gap-2">
                  <span>💉 <strong>建議初劑量追加：${calc.transitionInfo.bolusMl.toFixed(1)} mL</strong> (${calc.transitionInfo.bolusMass.toFixed(1)} ${spec.massUnit})</span>
                  <span class="text-[11px] text-[#7dd3fc]">給予後依下方色塊設定流速</span>
                </div>
              `;
            } else if (calc.transitionInfo.type === 'step_up') {
              transitionBannerHtml = `
                <div class="bg-[#3b2506] border-2 border-[#f59e0b] px-2.5 py-2 text-xs text-[#fef08a] space-y-0.5">
                  <div class="font-bold text-[#fbbf24]">🔼 調升 Ce (${calc.transitionInfo.prevCe} ➔ ${pump.confirmedTarget}) 建議追加：</div>
                  <div>請追加 <strong>${calc.transitionInfo.bolusMl.toFixed(1)} mL</strong> (${calc.transitionInfo.bolusMass.toFixed(1)} ${spec.massUnit})，或以 <strong>${calc.transitionInfo.boost2MinMlHr.toFixed(1)} mL/hr</strong> 快推 2 分鐘後改設下方流速。</div>
                </div>
              `;
            } else if (calc.transitionInfo.type === 'step_down') {
              transitionBannerHtml = `
                <div class="bg-[#06332b] border-2 border-[#10b981] px-2.5 py-2 text-xs text-[#a7f3d0] space-y-0.5">
                  <div class="font-bold text-[#34d399]">⏸️ 調降 Ce (${calc.transitionInfo.prevCe} ➔ ${pump.confirmedTarget}) 建議等待時間：</div>
                  <div>請先<strong>暫停輸注等待 ${calc.transitionInfo.pauseMin.toFixed(1)} 分鐘</strong>，待濃度降至目標後再設為下方流速。</div>
                </div>

          const scheduleCellsHtml = calc.schedule.map(item => {
            const isCurrent = calc.activeCheckpointMin === item.tMin;
            return `

                <div class="text-[10px] ${isCurrent ? 'text-black font-black' : 'text-[#94a3b8]'}">${item.label}</div>
                <div class="font-vt text-lg leading-tight ${isCurrent ? 'text-black font-black' : 'text-[#fde047]'}">${item.mlHr.toFixed(1)}</div>
              </button>

          confirmedDetailsHtml = `

              <div class="flex items-center justify-between gap-1 flex-wrap">

                <button type="button" data-action="reset-time" data-id="${pump.instanceId}"
                  class="px-1.5 py-0.5 text-[10px] bg-[#1e293b] hover:bg-[#334155] text-[#cbd5e1] border border-[#475569] font-bold">
                  ↺ 重置計時
                </button>
              </div>

              <!-- 7 Checkpoints Grid: 15m, 30m, 45m, 60m, 90m, 2hr, 3hr -->
              <div class="grid grid-cols-7 gap-1">
                ${scheduleCellsHtml}

              <div class="text-[10px] text-[#94a3b8] flex items-center justify-between gap-1">
                <span>目前生效目標: <strong class="text-[#00f0ff]">Ce ${pump.confirmedTarget} ${spec.targetUnit}</strong></span>
                <span class="text-[#86efac]">點選色塊可快轉測試時間</span>
              </div>
            </div>

            <!-- HIGH-VISIBILITY GOLDEN/AMBER RECOMMENDED INFUSION RATE DISPLAY -->
            <div class="rate-display-box p-3 flex items-center justify-between gap-2">
              <div>
                <span class="inline-block bg-[#f59e0b] text-black text-xs font-black px-2 py-0.5 border border-black">
                  ⚡ 建議流速 (${calc.activeCheckpointMin >= 120 ? (calc.activeCheckpointMin / 60) + 'hr' : calc.activeCheckpointMin + 'm'})
                </span>
              </div>
              <div class="flex items-baseline gap-1.5">
                <span class="font-vt text-5xl sm:text-6xl font-black rate-number-glow leading-none">
                  ${calc.activeMlHr.toFixed(1)}
                </span>
                <span class="bg-[#f59e0b] text-black font-pixel-en text-[10px] font-bold px-1.5 py-1 border border-black">
                  mL/hr
                </span>
              </div>
            </div>
          `;
        } else {
          // Maintenance NMBD drugs after confirmation
          confirmedDetailsHtml = `
            <div class="rate-display-box p-3 flex items-center justify-between gap-2">
              <div>
                <span class="inline-block bg-[#f59e0b] text-black text-xs font-black px-2 py-0.5 border border-black">
                  ⚡ 建議流速
                </span>
              </div>
              <div class="flex items-baseline gap-1.5">
                <span class="font-vt text-5xl sm:text-6xl font-black rate-number-glow leading-none">
                  ${calc.activeMlHr.toFixed(1)}
                </span>
                <span class="bg-[#f59e0b] text-black font-pixel-en text-[10px] font-bold px-1.5 py-1 border border-black">
                  mL/hr
                </span>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <!-- TOPMOST BAR: Elapsed Pump Usage Timer (時、分、秒) -->
          <div class="px-3 py-1.5 bg-[#070b12] border-b border-[#1e293b] flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <span class="inline-block w-2 h-2 ${pump.started ? 'bg-[#39ff14]' : 'bg-[#64748b]'}"></span>
              <span class="text-[11px] font-bold text-[#94a3b8]">已使用時間：</span>
              <span data-timer-display="${pump.instanceId}" class="font-vt text-xl tracking-wider ${pump.started ? 'text-[#39ff14] font-bold' : 'text-[#64748b]'}">
                ${formatHms(calc.totalElapsedSec)}
              </span>
            </div>
            <button type="button" data-action="remove-single-pump" data-id="${pump.instanceId}" title="移除此台幫浦"
              class="pixel-btn bg-[#451a1a] hover:bg-[#7f1d1d] text-[#fca5a5] text-[11px] px-2 py-0 font-bold shrink-0">
              ✕
            </button>
          </div>

          <!-- Second Row: Drug Name + Concentration right beside it -->
          <div class="px-3 py-2 bg-[#101622] border-b-2 border-[#2a3447] flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2 flex-wrap min-w-0">
              <span class="font-pixel-en text-[11px] px-1.5 py-0.5 border border-black font-bold shrink-0" style="background:${spec.isoColor}; color:#000;">
                #${idx + 1}
              </span>
              <h3 class="font-bold text-base text-white">${spec.name}</h3>
              <div class="flex items-center gap-1 bg-[#0b0f17] border border-[#2e3a52] px-1.5 py-0.5">
                ${concPresetsHtml}
                <input type="number" step="0.5" min="0.1" max="1000"
                  data-action="input-conc" data-id="${pump.instanceId}"
                  value="${pump.conc}"
                  title="自訂藥物濃度"
                  class="w-12 bg-[#05080c] border border-[#3b465e] text-center font-vt text-base text-[#fde047] px-1 py-0 focus:outline-none focus:border-[#fde047]" />
                <span class="text-[11px] text-[#94a3b8] font-mono">${spec.concUnit}</span>
              </div>
            </div>
          </div>

          <!-- Pump Body -->
          <div class="p-3 flex-1 flex flex-col justify-between space-y-2.5">

            <!-- Target Ce / Target Dose Controls + 確認濃度 Button -->
            <div class="bg-[#0f1521] border-2 border-[#283347] p-2.5">
              <div class="flex items-center justify-between gap-1 mb-1 flex-wrap">
                <span class="text-xs font-bold text-[#e2e8f0]">
                  🎯 ${spec.mode === 'tci_ce' ? `Ce (${spec.targetUnit})` : `維持劑量 (${spec.targetUnit})`}
                </span>
                <div class="flex items-center gap-1">
                  <button type="button" data-action="step-target" data-id="${pump.instanceId}" data-delta="${-spec.stepTarget}"
                    class="pixel-btn bg-[#1e293b] text-white px-2.5 py-0.5 text-sm font-bold">-</button>
                  <input type="number" step="${spec.stepTarget}" min="${spec.minTarget}" max="${spec.maxTarget}"
                    data-action="input-target" data-id="${pump.instanceId}"
                    value="${pump.target}"
                    class="w-16 bg-[#05080d] border-2 border-[#38bdf8] text-center font-vt text-2xl text-[#00f0ff] py-0" />
                  <button type="button" data-action="step-target" data-id="${pump.instanceId}" data-delta="${spec.stepTarget}"
                    class="pixel-btn bg-[#1e293b] text-white px-2.5 py-0.5 text-sm font-bold">+</button>
                </div>
              </div>

              <input type="range" class="pixel-slider my-1.5"
                min="${spec.minTarget}" max="${spec.maxTarget}" step="${spec.stepTarget}"
                data-action="slider-target" data-id="${pump.instanceId}"
                value="${pump.target}" />

              <div class="grid grid-cols-4 gap-1 mt-1 mb-2">
                ${targetPresetsHtml}
              </div>

              <!-- Confirm Concentration Button -->
              <button type="button" data-action="confirm-ce" data-id="${pump.instanceId}"
                class="pixel-btn w-full py-1.5 text-xs sm:text-sm font-black flex items-center justify-center gap-1.5 ${hasUnconfirmedChange ? 'bg-[#39ff14] hover:bg-[#4ade80] text-black' : 'bg-[#15803d] hover:bg-[#16a34a] text-white'}">
                <span>✓</span> 確認濃度 ${!pump.started ? '(啟動計時)' : hasUnconfirmedChange ? `(套用新目標 ${pump.target})` : `(已確認 ${pump.confirmedTarget})`}
              </button>
            </div>

            ${confirmedDetailsHtml}

          </div>
        `;

        grid.appendChild(card);
      });
    }

    function renderAll() {
      const anthro = updatePatientMonitorUI();
      updateSetupCollapseUI();
      renderDrugSelectorDock();
      renderPumpRack(anthro);
    }

    // =========================================================================
    // EVENT DELEGATION & LISTENERS
    // =========================================================================
    function setupListeners() {
      document.getElementById('sexMale').addEventListener('click', () => {
        playBeep(500, 0.04);
        state.patient.sex = 'M';
        renderAll();
      });
      document.getElementById('sexFemale').addEventListener('click', () => {
        playBeep(580, 0.04);
        state.patient.sex = 'F';
        renderAll();
      });

      const bindPatientInput = (id, key, min, max) => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
          const val = parseFloat(el.value);
          if (!isNaN(val)) {
            state.patient[key] = Math.min(max, Math.max(min, val));
            renderAll();
          }
        });
      };
      bindPatientInput('inputAge', 'age', 18, 100);
      bindPatientInput('inputHeight', 'height', 120, 220);
      bindPatientInput('inputWeight', 'weight', 30, 200);

      document.querySelectorAll('[data-step-target]').forEach(btn => {
        btn.addEventListener('click', () => {
          playBeep(480, 0.04);
          const targetId = btn.getAttribute('data-step-target');
          const delta = parseFloat(btn.getAttribute('data-step-val'));
          const inputEl = document.getElementById(targetId);
          const min = parseFloat(inputEl.min);
          const max = parseFloat(inputEl.max);
          const nextVal = Math.min(max, Math.max(min, (parseFloat(inputEl.value) || 50) + delta));
          inputEl.value = nextVal;
          inputEl.dispatchEvent(new Event('input'));
        });
      });

      document.getElementById('drugSelectorDock').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-qty-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-qty-action');
        const drugId = btn.getAttribute('data-drug');
        const current = state.pendingCounts[drugId] || 0;

        if (action === 'inc') {
          playBeep(660, 0.05, 'square');
          state.pendingCounts[drugId] = Math.min(10, current + 1);
        } else if (action === 'dec') {
          playBeep(420, 0.05, 'square');
          state.pendingCounts[drugId] = Math.max(0, current - 1);
        }
        renderDrugSelectorDock();
      });

      document.getElementById('btnConfirmPumps').addEventListener('click', () => {
        playBeep(820, 0.08, 'square');
        applyPendingPumpsAndShow();
      });

      document.getElementById('btnClearAllPumps').addEventListener('click', () => {
        playBeep(280, 0.08, 'sawtooth');
        clearAllPumps();
      });
      document.getElementById('btnClearActiveRack').addEventListener('click', () => {
        playBeep(280, 0.08, 'sawtooth');
        clearAllPumps();
      });

      document.getElementById('btnExpandSetup').addEventListener('click', () => {
        playBeep(520, 0.04);
        state.setupCollapsed = false;
        renderAll();
      });
      document.getElementById('btnCollapseSetupTop').addEventListener('click', () => {
        playBeep(460, 0.04);
        state.setupCollapsed = true;
        renderAll();
      });

      const soundBtn = document.getElementById('btnSoundToggle');
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
        soundBtn.className = soundEnabled
          ? 'pixel-btn bg-[#14532d] text-[#86efac] text-xs font-bold px-2.5 py-1.5'
          : 'pixel-btn bg-[#1f2937] text-[#cbd5e1] text-xs font-bold px-2.5 py-1.5';
        if (soundEnabled) playBeep(880, 0.06);
      });

      const grid = document.getElementById('pumpRackGrid');

      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const id = parseInt(btn.getAttribute('data-id'), 10);
        const pump = state.pumps.find(p => p.instanceId === id);
        if (!pump) return;
        const spec = DRUG_CATALOG[pump.drugId];

        if (action === 'remove-single-pump') {
          playBeep(320, 0.06, 'sawtooth');
          state.pumps = state.pumps.filter(p => p.instanceId !== id);
          state.pendingCounts[pump.drugId] = Math.max(0, (state.pendingCounts[pump.drugId] || 1) - 1);
          if (state.pumps.length === 0) state.setupCollapsed = false;
          renderAll();
        } else if (action === 'set-conc') {
          playBeep(560, 0.04);
          pump.conc = parseFloat(btn.getAttribute('data-val'));
          renderAll();
        } else if (action === 'set-target') {
          playBeep(600, 0.04);
          pump.target = parseFloat(btn.getAttribute('data-val'));
          renderAll();
        } else if (action === 'step-target') {
          playBeep(540, 0.03);
          const delta = parseFloat(btn.getAttribute('data-delta'));
          const next = Math.min(spec.maxTarget, Math.max(spec.minTarget, +(pump.target + delta).toFixed(2)));
          pump.target = next;
          renderAll();
        } else if (action === 'confirm-ce') {
          playBeep(780, 0.07, 'square');
          confirmPumpTarget(pump);
        } else if (action === 'select-time') {
          playBeep(580, 0.04);
          // Fast-forward/sync current stage timer to the clicked checkpoint (e.g., 30m -> 30*60 sec)
          const targetMin = parseInt(btn.getAttribute('data-min'), 10);
          pump.stageStartMs = Date.now();
          pump.stageOffsetSec = targetMin * 60;
          pump.lastAutoCheckpoint = getAutoCheckpointForMinutes(targetMin);
          renderAll();
        } else if (action === 'reset-time') {
          playBeep(360, 0.05);
          pump.history = [];
          pump.stageStartMs = Date.now();
          pump.stageOffsetSec = 0;
          pump.lastAutoCheckpoint = 15;
          renderAll();
        }
      });

      grid.addEventListener('change', (e) => {
        const input = e.target.closest('input[data-action]');
        if (!input) return;
        const action = input.getAttribute('data-action');
        const id = parseInt(input.getAttribute('data-id'), 10);
        const pump = state.pumps.find(p => p.instanceId === id);
        if (!pump) return;

        if (action === 'input-conc') {
          const v = parseFloat(input.value);
          if (!isNaN(v) && v > 0) {
            pump.conc = v;
            renderAll();
          }
        } else if (action === 'input-target' || action === 'slider-target') {
          const v = parseFloat(input.value);
          if (!isNaN(v) && v > 0) {
            pump.target = v;
            renderAll();
          }
        }
      });

      grid.addEventListener('input', (e) => {
        const input = e.target.closest('input[data-action="slider-target"]');
        if (!input) return;
        const id = parseInt(input.getAttribute('data-id'), 10);
        const pump = state.pumps.find(p => p.instanceId === id);
        if (!pump) return;
        const v = parseFloat(input.value);
        if (!isNaN(v)) {
          pump.target = v;
          renderAll();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupListeners();
      startGlobalTicker();
      renderAll();
    });
  </script>
</body>
</html>
